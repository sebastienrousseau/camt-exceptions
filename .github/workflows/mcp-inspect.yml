name: MCP Protocol Conformance

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    name: MCP Inspector (tools/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install camt-exceptions
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: List tools via MCP Inspector CLI
        run: npx -y @modelcontextprotocol/inspector --cli camt-exceptions-mcp --method tools/list

      - name: Serve streamable HTTP and SSE in the background
        run: |
          camt-exceptions-mcp --transport streamable-http --port 8000 &
          camt-exceptions-mcp --transport sse --port 8001 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null -X POST http://127.0.0.1:8000/mcp \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{}' && break
            sleep 1
          done

      - name: List tools over streamable HTTP via MCP Inspector CLI
        run: npx -y @modelcontextprotocol/inspector --cli http://127.0.0.1:8000/mcp --transport http --method tools/list

      - name: List tools over SSE via MCP Inspector CLI
        run: npx -y @modelcontextprotocol/inspector --cli http://127.0.0.1:8001/sse --transport sse --method tools/list
