[tool.poetry]
name = "camt-exceptions"
version = "0.0.18"
description = "Generate and validate ISO 20022 Exceptions & Investigations (E&I) camt messages -- camt.056 Payment Cancellation Request and camt.029 Resolution of Investigation -- with an MCP server."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/camt-exceptions"
homepage = "https://camt-exceptions.com"
keywords = [
    "iso-20022",
    "camt056",
    "exceptions",
    "investigations",
    "payment-cancellation",
    "mcp",
    "payments",
    "fintech",
]
packages = [
    { include = "camt_exceptions" },
]
include = [
    "camt_exceptions/templates/**/*.xsd",
    "camt_exceptions/templates/**/*.xml",
]

[tool.poetry.scripts]
camt-exceptions-mcp = "camt_exceptions.server:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
mcp = ">=1.2,<3"
jinja2 = ">=3.0"
xmlschema = ">=2.0"

# Transitive, via `mcp` -> `pyjwt[crypto]`. Nothing in this tree
# constrains it, so a resolver is free to pick a version in the
# >=44.0.0,<50.0.0 range that GHSA flags as high severity. Floored
# here so the patched line is the only resolvable one; the pins in
# requirements/ already sit at 50.0.0.
cryptography = ">=50.0.0"
[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
black = "^26.3.1"
ruff = "^0.1.0"
mypy = "^1.11.0"
bandit = "^1.7.0"
# tests/test_suite_conformance.py parses pyproject.toml. tomllib is
# stdlib only from 3.11 and the suite floor is 3.10, so without the
# backport the conformance gate does not run there at all.
tomli = { version = ">=2", python = "<3.11" }
packaging = ">=23"
hypothesis = ">=6.100,<7"
interrogate = "^1.7.0"
mutmut = ">=3.7,<4"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = ">=7,<10"
furo = ">=2024.1"
myst-parser = { version = ">=3,<5", extras = ["linkify"] }
sphinx-autodoc-typehints = ">=2,<4"
sphinx-copybutton = ">=0.5,<1"

[tool.poetry.urls]
Documentation = "https://sebastienrousseau.github.io/camt-exceptions/"
Changelog = "https://github.com/sebastienrousseau/camt-exceptions/blob/main/CHANGELOG.md"
Issues = "https://github.com/sebastienrousseau/camt-exceptions/issues"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# tests/test_suite_conformance.py is generated and vendored from one
# canonical copy shared across the suite, and checksummed by its own
# test. The suite uses three different line lengths, so letting each
# repository's formatter rewrite it would make the checksum
# unsatisfiable everywhere.
[tool.black]
extend-exclude = "tests/test_suite_conformance\\.py"
line-length = 79
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=camt_exceptions",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
    # Load/stress tests (marker ``perf``) are excluded from the default
    # coverage-gated run, matching the suite-wide camt053 convention.
    # Select them explicitly with ``-m perf --no-cov``.
    "-m", "not perf",
]
markers = [
    "perf: performance/load/stress tests (excluded from the default gate)",
]

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-semiprivate = false
ignore-private = false
ignore-magic = true
exclude = ["tests", "benches", "examples", "docs", "scripts"]

[tool.mutmut]
# Mutation testing (mutmut 3): every tool handler and the generator it
# wraps are mutated and each mutant must be caught by the fast tests.
# The perf-marked stress file and the suite conformance file are
# excluded from the selection because they do not test handler logic
# and dominate runtime.
source_paths = ["camt_exceptions"]
# The SDK-compat shim branches on the installed MCP SDK version; the
# branches for other versions cannot be reached on one install, so its
# surviving mutants say nothing about the tests. Handlers only.
# _cli.py is argparse wiring: flag names, defaults and help prose. Its
# tests pin the flags and defaults; a mutant of a help sentence or a
# parser description is not a bug a test should have to name. The
# transport dispatch it drives, _transports.run, is mutated.
do_not_mutate = ["camt_exceptions/_mcp_compat.py", "camt_exceptions/_cli.py"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider", "--no-cov"]
pytest_add_cli_args_test_selection = [
    "tests/test_generator.py",
    "tests/test_server.py",
    "tests/test_mcp_sdk_compat.py",
    "tests/test_properties.py",
    "tests/test_transports.py",
]

[tool.coverage.run]
branch = true
source = ["camt_exceptions"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "@overload",
]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.md", "tmp_env", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = [
    "tmp_env/",
    ".venv/",
    ".eggs/",
]

# The server object comes from the SDK-compat shim, so its decorators
# are untyped from mypy's point of view on either major.
[[tool.mypy.overrides]]
module = "camt_exceptions.server"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["mcp.*", "xmlschema.*", "jinja2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The server tools and generator return bare JSON-shaped data / rendered
# strings from loosely-typed inputs. Relax the two strict checks that trips
# while keeping the rest of strict mode in force.
module = ["camt_exceptions.server", "camt_exceptions.generator"]
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "return-value", "attr-defined", "assignment"]
